[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "piilint"
version = "0.1.0"
description = "Local-first PII scanner for notebooks, CSV, JSON, Parquet, and source code."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Emanuel" }]
keywords = ["pii", "privacy", "scanner", "security", "pre-commit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "phonenumbers>=8.13",
  "pathspec>=0.12",
  "pyyaml>=6.0",
  "pyarrow>=15.0",
  "nbformat>=5.9",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
ner = []  # Phase 7: presidio-analyzer + spaCy
dev = [
  "pytest>=8.0",
  "pytest-socket>=0.7",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
piilint = "piilint.cli:run"

[project.urls]
Homepage = "https://github.com/thelonewander3r/PIIScanner"
Documentation = "https://github.com/thelonewander3r/PIIScanner#readme"
Repository = "https://github.com/thelonewander3r/PIIScanner"
Issues = "https://github.com/thelonewander3r/PIIScanner/issues"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
exclude = ["tests/corpus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/piilint"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["phonenumbers.*", "pathspec.*", "nbformat.*", "nbformat.reader.*", "pyarrow.*", "tomli"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"
pythonpath = ["src"]

[tool.piilint]
# Example config surface; runtime prefers piilint.toml (Phase 3).
